[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "celldx"
version = "3.0.0"
description = "Probabilistic per-cell battery fault diagnosis and action engine with open-data baselines"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "pydantic>=2.5",
  "PyYAML>=6.0",
  "typer>=0.9",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
dev = ["pytest>=7", "hypothesis>=6", "ruff>=0.4", "mypy>=1.8", "pyarrow>=14"]

[project.scripts]
celldx = "celldx.cli.main:app"

[tool.setuptools.packages.find]
include = ["celldx*"]

[tool.setuptools.package-data]
celldx = ["config/*.yaml", "data/*.json"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501", "B008", "E741"]  # E741: I, V, T are the physics names

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: long-running statistical tests",
  "nasa: needs the NASA PCoE files in the local cache",
]
